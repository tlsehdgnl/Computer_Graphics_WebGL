<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>2026 컴퓨터 그래픽스</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 22px;
            z-index: 100;
            font-family: Arial, sans-serif;
        }

        #message {
            position: absolute;
            bottom: 50px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 24px;
            z-index: 100;
            font-family: Arial, sans-serif;
        }

        #crosshair {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 28px;
            z-index: 100;
            pointer-events: none;
        }

        #fadeOverlay {
            position: absolute;
            inset: 0;
            background: black;
            opacity: 0;
            pointer-events: none;
            z-index: 9998;
        }

        #startScreen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: black;
            color: white;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            z-index: 9999;

            font-family: Arial, sans-serif;
        }

        #startScreen h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        #startScreen p {
            font-size: 22px;
            line-height: 1.8;
        }

        #startBtn {
            margin-top: 30px;

            padding: 15px 40px;

            font-size: 24px;

            border: none;

            cursor: pointer;

            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div id="startScreen">

        <h1>문을 선택하세요</h1>

        <p>
            주변에는 여러 개의 문이 있습니다.<br><br>

            각 문은 서로 다른 길로 이어집니다.<br><br>

            정답은 없습니다.<br>
            자신의 판단에 따라 가장 옳다고 생각하는 문을 선택하세요.<br><br>

            이동 : WASD<br>
            시점 이동 : 마우스<br>
            문 선택 : E
        </p>

        <button id="startBtn">
            시작하기
        </button>

    </div>
    <canvas id="glCanvas"></canvas>

    <div id="ui">
        <div id="levelText">
            선택 단계 : 1
        </div>
    </div>

    <div id="message"></div>

    <div id="crosshair">
        +
    </div>

    <div id="fadeOverlay"></div>

    <script type="text/javascript" src="shaders/initShaders2.js"></script>
    <script type="text/javascript" src="MV.js"></script>
    <script type="module">
        const levelText =
            document.getElementById("levelText");

        const message =
            document.getElementById("message");

        var gl;

        let vertices = [];
        let CubeVertexCount = 0;

        let worldMatLoc;
        let viewMatLoc;
        let projMatLoc;

        let objectColorLoc;
        let eyePosLoc;

        let fogStartLoc;
        let fogEndLoc;

        let eye = vec3(0, 2, 10);

        let yaw = 180;
        let pitch = 0;

        let keys = {};

        let doors = [];

        let selectedDoor = null;

        let stage = 0;

        const stages =
            Array.from({ length: 20 }, (_, i) =>
                Math.max(2, Math.round(2 * Math.pow(1.33, i)))
            );

        let stageStartTime =
            performance.now();

        let stageTimes = [];

        let fogStart = 120;
        let fogEnd = 260;

        let gameStarted = false;

        let doorOBJVertices = [];
        let doorOBJVertexCount = 0;
        let doorOBJBuffer = null;

        let doorTexture = null;
        let texImageLoc;
        let useTextureLoc;
        let useAOLoc;

        let doorAOTexture = null;
        let aoImageLoc;

        let floorBuffer = null;
        let floorVertexCount = 6;

        let grassTexture = null;

        let fadeOverlay = null;
        let transitionState = "idle";
        let transitionTime = 0;
        const transitionDuration = 400;
        let lastRenderTime = performance.now();

        generateModel();

        (async () => {
            await init();
            render();
        })();

        function createDoors(count) {

            doors = [];

            const progress = stage / (stages.length - 1);
            const spawnRange = 12 + progress * 68; // 초반에는 12, 후반에는 80까지
            const minDistance = 3 + progress * 5; // 초반에는 가까이, 후반에는 더 멀리

            for (let i = 0; i < count; i++) {

                let x, z;
                let valid = false;

                while (!valid) {

                    x =
                        eye[0] +
                        (Math.random() * 2 - 1)
                        * spawnRange;

                    z =
                        eye[2] +
                        (Math.random() * 2 - 1)
                        * spawnRange;

                    valid = true;

                    // 플레이어 너무 가까운 곳 금지
                    let playerDist =
                        Math.sqrt(
                            (x - eye[0]) * (x - eye[0]) +
                            (z - eye[2]) * (z - eye[2])
                        );

                    if (playerDist < minDistance)
                        valid = false;

                    // 문끼리 겹침 방지
                    for (let door of doors) {

                        let dist =
                            Math.sqrt(
                                (x - door.x) * (x - door.x) +
                                (z - door.z) * (z - door.z)
                            );

                        if (dist < 4) {
                            valid = false;
                            break;
                        }
                    }
                }

                doors.push({
                    x: x,
                    z: z,

                    color: [
                        Math.random(),
                        Math.random(),
                        Math.random()
                    ]
                });
            }

            levelText.innerHTML =
                "선택 단계 : " +
                (stage + 1);
        }

        function updatePlayer() {
            let speed = 0.25;

            let forward =
                vec3(
                    Math.sin(radians(yaw)),
                    0,
                    -Math.cos(radians(yaw))
                );

            let right =
                vec3(
                    Math.cos(radians(yaw)),
                    0,
                    Math.sin(radians(yaw))
                );

            if (keys["w"] || keys["ㅈ"])
                eye = add(
                    eye,
                    scale(speed, forward)
                );

            if (keys["s"] || keys["ㄴ"])
                eye = subtract(
                    eye,
                    scale(speed, forward)
                );

            if (keys["a"] || keys["ㅁ"])
                eye = subtract(
                    eye,
                    scale(speed, right)
                );

            if (keys["d"] || keys["ㅇ"])
                eye = add(
                    eye,
                    scale(speed, right)
                );
        }

        function updateSelection() {

            selectedDoor = null;

            let bestDist = 99999;

            for (let door of doors) {

                let dx =
                    eye[0] - door.x;

                let dz =
                    eye[2] - door.z;

                let dist =
                    Math.sqrt(
                        dx * dx +
                        dz * dz
                    );

                if (
                    dist < 4 &&
                    dist < bestDist
                ) {
                    bestDist = dist;
                    selectedDoor = door;
                }
            }

            if (selectedDoor) {

                message.innerHTML =
                    "E 키를 눌러 선택";

            } else {

                message.innerHTML = "";
            }
        }

        window.addEventListener(
            "keydown",
            function (e) {
                keys[e.key.toLowerCase()] = true;

                if (
                    (e.key.toLowerCase() === "e"
                        || e.key === "ㄷ")
                    &&
                    selectedDoor
                ) {
                    startStageTransition();
                }
            });

        function nextStage() {
            let elapsed =
                (
                    performance.now()
                    -
                    stageStartTime
                ) / 1000;

            stageTimes.push(elapsed);

            stage++;

            if (
                stage >=
                stages.length
            ) {
                showEnding();
                return;
            }

            fogStart -= 0.5;
            fogEnd -= 1;

            stageStartTime =
                performance.now();

            createDoors(
                stages[stage]
            );
        }

        function startStageTransition() {
            if (transitionState !== "idle")
                return;

            transitionState = "fade-out";
            transitionTime = 0;
            if (fadeOverlay)
                fadeOverlay.style.opacity = 0;
        }

        function updateTransition(delta) {
            if (transitionState === "idle")
                return;

            transitionTime += delta;
            if (transitionState === "fade-out") {
                let t = Math.min(
                    transitionTime / transitionDuration,
                    1
                );
                fadeOverlay.style.opacity = t;

                if (t >= 1) {
                    nextStage();
                    transitionState = "fade-in";
                    transitionTime = 0;
                }
            }
            else if (transitionState === "fade-in") {
                let t = Math.min(
                    transitionTime / transitionDuration,
                    1
                );
                fadeOverlay.style.opacity = 1 - t;

                if (t >= 1) {
                    transitionState = "idle";
                }
            }
        }

        function showEnding() {

            let total = 0;

            for (let t of stageTimes)
                total += t;

            let avg =
                total /
                stageTimes.length;

            let leftColumn = "";
            let rightColumn = "";

            for (let i = 0; i < stageTimes.length; i++) {
                const entry =
                    `
            <div style="margin-bottom: 12px; line-height: 1.4; text-align: left;">
                Stage ${i + 1} (${stages[i]}개의 문) - ${stageTimes[i].toFixed(2)}초
            </div>
            `;

                if (i < 10) {
                    leftColumn += entry;
                } else {
                    rightColumn += entry;
                }
            }

            let stageResult =
                `
            <div style="display:flex; gap:40px; justify-content:center; flex-wrap:wrap; max-width:900px;">
                <div style="flex:1; min-width:240px; text-align:left;">
                    ${leftColumn}
                </div>
                <div style="flex:1; min-width:240px; text-align:left;">
                    ${rightColumn}
                </div>
            </div>
            `;

            document.body.innerHTML =
                `
        <div style="
            width:100vw;
            height:100vh;
            background:black;
            color:white;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            font-family:Arial;
            text-align:center;
            overflow:auto;
        ">

            <h1>선택의 역설</h1>

            <h2>
                평균 고민 시간 :
                ${avg.toFixed(2)}초
            </h2>

            <br>

            <h3>스테이지별 고민 시간</h3>

            ${stageResult}

            <br>

            <p style="font-size:24px">
                선택지는 늘어났지만<br>
                결정은 더 어려워졌습니다.
            </p>

            <button id="restartBtn" style="
                margin-top: 30px;
                padding: 15px 30px;
                font-size: 20px;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                background: #4caf50;
                color: white;
            " onclick="location.reload()">
                다시 하기
            </button>

        </div>
        `;
        }

        function generateModel() {
            const p =
                [
                    vec3(-0.5, -0.5, -0.5),
                    vec3(0.5, -0.5, -0.5),
                    vec3(0.5, 0.5, -0.5),
                    vec3(-0.5, 0.5, -0.5),

                    vec3(-0.5, -0.5, 0.5),
                    vec3(0.5, -0.5, 0.5),
                    vec3(0.5, 0.5, 0.5),
                    vec3(-0.5, 0.5, 0.5)
                ];

            quad(1, 0, 3, 2);
            quad(2, 3, 7, 6);
            quad(3, 0, 4, 7);
            quad(6, 5, 1, 2);
            quad(4, 5, 6, 7);
            quad(5, 4, 0, 1);

            function quad(a, b, c, d) {
                let n = vec3(0, 1, 0);

                push(a, n);
                push(b, n);
                push(c, n);

                push(a, n);
                push(c, n);
                push(d, n);
            }

            function push(i, n) {
                vertices.push(p[i]);
                vertices.push(n);
                vertices.push(vec2(0, 0));

                CubeVertexCount++;
            }
        }

        function generateFloor() {
            const floorData =
                [
                    // x,y,z,u,v

                    -500, 0, -500, 0, 0,
                    500, 0, -500, 250, 0,
                    500, 0, 500, 250, 250,

                    -500, 0, -500, 0, 0,
                    500, 0, 500, 250, 250,
                    -500, 0, 500, 0, 250
                ];

            floorBuffer =
                gl.createBuffer();

            gl.bindBuffer(
                gl.ARRAY_BUFFER,
                floorBuffer
            );

            gl.bufferData(
                gl.ARRAY_BUFFER,
                new Float32Array(floorData),
                gl.STATIC_DRAW
            );
        }

        async function init() {
            const canvas =
                document.getElementById("glCanvas");

            canvas.width =
                window.innerWidth;

            canvas.height =
                window.innerHeight;

            gl =
                canvas.getContext("webgl2");

            gl.viewport(
                0,
                0,
                canvas.width,
                canvas.height
            );

            gl.enable(gl.DEPTH_TEST);

            const program =
                initShaders(
                    gl,
                    "shaders/choice_vert.glsl",
                    "shaders/choice_frag.glsl"
                );

            gl.useProgram(program);

            let buffer =
                gl.createBuffer();

            gl.bindBuffer(
                gl.ARRAY_BUFFER,
                buffer
            );

            gl.bufferData(
                gl.ARRAY_BUFFER,
                flatten(vertices),
                gl.STATIC_DRAW
            );

            gl.enableVertexAttribArray(0);
            gl.vertexAttribPointer(
                0, 3, gl.FLOAT, false,
                32, 0
            );

            gl.enableVertexAttribArray(1);
            gl.vertexAttribPointer(
                1, 3, gl.FLOAT, false,
                32, 12
            );

            gl.enableVertexAttribArray(2);
            gl.vertexAttribPointer(
                2, 2, gl.FLOAT, false,
                32, 24
            );

            worldMatLoc =
                gl.getUniformLocation(
                    program,
                    "worldMat"
                );

            viewMatLoc =
                gl.getUniformLocation(
                    program,
                    "viewMat"
                );

            projMatLoc =
                gl.getUniformLocation(
                    program,
                    "projMat"
                );

            objectColorLoc =
                gl.getUniformLocation(
                    program,
                    "objectColor"
                );

            eyePosLoc =
                gl.getUniformLocation(
                    program,
                    "eyePos"
                );

            fogStartLoc =
                gl.getUniformLocation(
                    program,
                    "fogStart"
                );

            fogEndLoc =
                gl.getUniformLocation(
                    program,
                    "fogEnd"
                );

            texImageLoc =
                gl.getUniformLocation(
                    program,
                    "texImage"
                );

            useTextureLoc =
                gl.getUniformLocation(
                    program,
                    "useTexture"
                );

            aoImageLoc =
                gl.getUniformLocation(
                    program,
                    "aoImage"
                );

            useAOLoc =
                gl.getUniformLocation(
                    program,
                    "useAO"
                );

            grassTexture =
                loadTexture(
                    "obj/grass.png"
                );

            let proj =
                perspective(
                    70,
                    canvas.width / canvas.height,
                    0.1,
                    1000
                );

            gl.uniformMatrix4fv(
                projMatLoc,
                false,
                flatten(proj)
            );

            createDoors(stages[0]);

            await loadOBJ("obj/Wooden-Door.obj");

            grassTexture =
                loadTexture(
                    "obj/grass.png"
                );

            doorTexture =
                loadTexture(
                    "obj/Diffuse.png"
                );

            doorAOTexture =
                loadTexture(
                    "obj/Diffuse_AO.png"
                );

            canvas.onclick =
                () =>
                    canvas.requestPointerLock();

            document.addEventListener(
                "mousemove",
                function (e) {
                    if (
                        document.pointerLockElement
                        !== canvas
                    )
                        return;

                    yaw += e.movementX * 0.15;
                    pitch -= e.movementY * 0.15;

                    pitch =
                        Math.max(
                            -89,
                            Math.min(89, pitch)
                        );
                }
            );

            window.addEventListener(
                "keyup",
                e =>
                    keys[e.key.toLowerCase()]
                    = false
            );

            document
                .getElementById("startBtn")
                .onclick = function () {

                    gameStarted = true;

                    document
                        .getElementById("startScreen")
                        .style.display = "none";

                    document
                        .getElementById("glCanvas")
                        .requestPointerLock();

                    stageStartTime =
                        performance.now();
                };

            fadeOverlay =
                document.getElementById(
                    "fadeOverlay"
                );

            generateFloor();
        }

        async function loadOBJ(url) {
            const text =
                await fetch(url)
                    .then(r => r.text());

            const positions = [];
            const texcoords = [];

            const finalData = [];

            const lines =
                text.split("\n");

            for (let line of lines) {
                line = line.trim();

                if (line.startsWith("v ")) {
                    const p =
                        line.split(/\s+/);

                    positions.push([
                        parseFloat(p[1]),
                        parseFloat(p[2]),
                        parseFloat(p[3])
                    ]);
                }

                else if (line.startsWith("vt ")) {
                    const p =
                        line.split(/\s+/);

                    texcoords.push([
                        parseFloat(p[1]),
                        1.0 - parseFloat(p[2])
                    ]);
                }

                else if (line.startsWith("f ")) {
                    const verts =
                        line.split(/\s+/)
                            .slice(1);

                    let face = [];

                    for (let v of verts) {
                        const parts =
                            v.split("/");

                        face.push({
                            pos:
                                parseInt(parts[0]) - 1,

                            tex:
                                parseInt(parts[1]) - 1
                        });
                    }

                    for (let i = 1; i < face.length - 1; i++) {
                        const tri = [
                            face[0],
                            face[i],
                            face[i + 1]
                        ];

                        for (let v of tri) {
                            finalData.push(
                                positions[v.pos][0],
                                positions[v.pos][1],
                                positions[v.pos][2],

                                texcoords[v.tex][0],
                                texcoords[v.tex][1]
                            );
                        }
                    }
                }
            }

            doorOBJVertexCount =
                finalData.length / 5;

            doorOBJBuffer =
                gl.createBuffer();

            gl.bindBuffer(
                gl.ARRAY_BUFFER,
                doorOBJBuffer
            );

            gl.bufferData(
                gl.ARRAY_BUFFER,
                new Float32Array(finalData),
                gl.STATIC_DRAW
            );

            console.log(
                "OBJ Loaded:",
                doorOBJVertexCount,
                "vertices"
            );
        }

        function isPowerOf2(value) {
            return (value & (value - 1)) === 0;
        }

        function loadTexture(url) {
            const texture =
                gl.createTexture();

            const image =
                new Image();

            image.onload = function () {
                gl.bindTexture(
                    gl.TEXTURE_2D,
                    texture
                );

                gl.texImage2D(
                    gl.TEXTURE_2D,
                    0,
                    gl.RGBA,
                    gl.RGBA,
                    gl.UNSIGNED_BYTE,
                    image
                );

                gl.texParameteri(
                    gl.TEXTURE_2D,
                    gl.TEXTURE_WRAP_S,
                    gl.REPEAT
                );

                gl.texParameteri(
                    gl.TEXTURE_2D,
                    gl.TEXTURE_WRAP_T,
                    gl.REPEAT
                );

                gl.texParameteri(
                    gl.TEXTURE_2D,
                    gl.TEXTURE_MAG_FILTER,
                    gl.LINEAR
                );

                if (isPowerOf2(image.width) && isPowerOf2(image.height)) {
                    gl.generateMipmap(
                        gl.TEXTURE_2D
                    );
                    gl.texParameteri(
                        gl.TEXTURE_2D,
                        gl.TEXTURE_MIN_FILTER,
                        gl.LINEAR_MIPMAP_LINEAR
                    );
                } else {
                    gl.texParameteri(
                        gl.TEXTURE_2D,
                        gl.TEXTURE_MIN_FILTER,
                        gl.LINEAR
                    );
                    gl.texParameteri(
                        gl.TEXTURE_2D,
                        gl.TEXTURE_WRAP_S,
                        gl.CLAMP_TO_EDGE
                    );
                    gl.texParameteri(
                        gl.TEXTURE_2D,
                        gl.TEXTURE_WRAP_T,
                        gl.CLAMP_TO_EDGE
                    );
                }
            };

            image.src = url;

            return texture;
        }

        function render() {
            let now = performance.now();
            let delta = now - lastRenderTime;
            lastRenderTime = now;

            if (!gameStarted) {
                requestAnimationFrame(render);
                return;
            }

            if (transitionState !== "idle") {
                updateTransition(delta);
            }

            if (transitionState === "idle") {
                updatePlayer();
                updateSelection();
            }

            gl.clearColor(
                0.03,
                0.03,
                0.05,
                1.0
            );

            gl.clear(
                gl.COLOR_BUFFER_BIT |
                gl.DEPTH_BUFFER_BIT
            );

            let forward =
                vec3(
                    Math.sin(radians(yaw)) *
                    Math.cos(radians(pitch)),

                    Math.sin(radians(pitch)),

                    -Math.cos(radians(yaw)) *
                    Math.cos(radians(pitch))
                );

            let view =
                lookAt(
                    eye,
                    add(eye, forward),
                    vec3(0, 1, 0)
                );

            gl.uniformMatrix4fv(
                viewMatLoc,
                false,
                flatten(view)
            );

            gl.uniform3fv(
                eyePosLoc,
                flatten(eye)
            );

            gl.uniform1f(
                fogStartLoc,
                fogStart
            );

            gl.uniform1f(
                fogEndLoc,
                fogEnd
            );

            gl.uniform1i(
                useTextureLoc,
                false
            );

            gl.uniform1i(
                useTextureLoc,
                true
            );

            gl.uniform1i(
                useAOLoc,
                false
            );

            gl.activeTexture(gl.TEXTURE0);

            gl.bindTexture(
                gl.TEXTURE_2D,
                grassTexture
            );

            gl.uniform1i(
                texImageLoc,
                0
            );

            // 바닥
            gl.uniform1i(
                useTextureLoc,
                true
            );

            gl.uniform1i(
                useAOLoc,
                false
            );

            gl.activeTexture(gl.TEXTURE0);

            gl.bindTexture(
                gl.TEXTURE_2D,
                grassTexture
            );

            gl.uniform1i(
                texImageLoc,
                0
            );

            gl.bindBuffer(
                gl.ARRAY_BUFFER,
                floorBuffer
            );

            gl.vertexAttribPointer(
                0,
                3,
                gl.FLOAT,
                false,
                20,
                0
            );

            gl.enableVertexAttribArray(0);

            gl.vertexAttribPointer(
                2,
                2,
                gl.FLOAT,
                false,
                20,
                12
            );

            gl.enableVertexAttribArray(2);

            gl.uniformMatrix4fv(
                worldMatLoc,
                false,
                flatten(mat4())
            );

            gl.drawArrays(
                gl.TRIANGLES,
                0,
                floorVertexCount
            );

            gl.uniform1i(
                useTextureLoc,
                true
            );

            gl.activeTexture(
                gl.TEXTURE0
            );

            gl.bindTexture(
                gl.TEXTURE_2D,
                doorTexture
            );

            gl.uniform1i(
                texImageLoc,
                0
            );

            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(
                gl.TEXTURE_2D,
                doorTexture
            );

            gl.uniform1i(
                texImageLoc,
                0
            );

            gl.activeTexture(gl.TEXTURE1);
            gl.bindTexture(
                gl.TEXTURE_2D,
                doorAOTexture
            );

            gl.uniform1i(
                aoImageLoc,
                1
            );

            gl.uniform1i(
                useAOLoc,
                true
            );

            // 문
            for (let door of doors) {
                let world =
                    mult(
                        translate(
                            door.x,
                            1.6,
                            door.z
                        ),
                        scalem(
                            0.8,
                            0.8,
                            0.8
                        )
                    );

                gl.uniformMatrix4fv(
                    worldMatLoc,
                    false,
                    flatten(world)
                );

                if (door === selectedDoor) {
                    gl.uniform3f(
                        objectColorLoc,
                        1.0,
                        1.0,
                        1.0
                    );
                }
                else {
                    gl.uniform3f(
                        objectColorLoc,
                        0.7,
                        0.5,
                        0.3
                    );
                }

                gl.bindBuffer(
                    gl.ARRAY_BUFFER,
                    doorOBJBuffer
                );

                gl.vertexAttribPointer(
                    0,
                    3,
                    gl.FLOAT,
                    false,
                    20,
                    0
                );

                gl.enableVertexAttribArray(0);

                gl.vertexAttribPointer(
                    2,
                    2,
                    gl.FLOAT,
                    false,
                    20,
                    12
                );

                gl.enableVertexAttribArray(2);

                gl.enableVertexAttribArray(0);

                gl.drawArrays(
                    gl.TRIANGLES,
                    0,
                    doorOBJVertexCount
                );
            }

            requestAnimationFrame(render);
        }

    </script>
</body>

</html>
