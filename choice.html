<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>20235197 신동휘</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 40px;
            z-index: 100;
            font-family: Arial, sans-serif;
        }

        #message {
            position: absolute;
            bottom: 50px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 40px;
            z-index: 100;
            font-family: Arial, sans-serif;
        }

        #crosshair {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 50px;
            z-index: 100;
            pointer-events: none;
        }

        #fadeOverlay {
            position: absolute;
            inset: 0;
            background: black;
            opacity: 0;
            pointer-events: none;
            z-index: 9998;
        }

        #startScreen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: black;
            color: white;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            z-index: 9999;

            font-family: Arial, sans-serif;
        }

        #startScreen h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        #startScreen p {
            font-size: 22px;
            line-height: 1.8;
        }

        #startBtn {
            margin-top: 30px;

            padding: 15px 40px;

            font-size: 24px;

            border: none;

            cursor: pointer;

            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div id="startScreen">

        <h1>문을 선택하세요</h1>

        <p>
            주변에는 여러 개의 문이 있습니다.<br><br>

            각 문은 서로 다른 길로 이어집니다.<br><br>

            정답은 없습니다.<br>
            자신의 판단에 따라 가장 옳다고 생각하는 문을 선택하세요.<br><br>

            이동 : WASD<br>
            시점 이동 : 마우스<br>
            문 선택 : E
        </p>

        <button id="startBtn">
            시작하기
        </button>

    </div>
    <canvas id="glCanvas"></canvas>

    <div id="ui">
        <div id="levelText">
            선택 단계 : 1
        </div>
    </div>

    <div id="message"></div>

    <div id="crosshair">
        +
    </div>

    <div id="fadeOverlay"></div>

    <script type="text/javascript" src="shaders/initShaders2.js"></script>
    <script type="text/javascript" src="MV.js"></script>
    <script type="module">
        const levelText =
            document.getElementById("levelText");

        const message =
            document.getElementById("message");

        var gl;

        let vertices = [];
        let CubeVertexCount = 0;

        let worldMatLoc;
        let viewMatLoc;
        let projMatLoc;

        let objectColorLoc;
        let eyePosLoc;

        let fogStartLoc;
        let fogEndLoc;

        let eye = vec3(0, 2, 10);

        let yaw = 180;
        let pitch = 0;

        let keys = {};

        let doors = [];

        let selectedDoor = null;

        let stage = 0;

        const stages =
            Array.from({ length: 20 }, (_, i) =>
                Math.max(2, Math.round(2 * Math.pow(1.33, i)))
            );

        let stageStartTime =
            performance.now();

        let stageTimes = [];

        let fogStart = 500;
        let fogEnd = 1000;

        let gameStarted = false;

        let doorOBJVertices = [];
        let doorOBJVertexCount = 0;
        let doorOBJBuffer = null;

        let doorTexture = null;
        let texImageLoc;
        let useTextureLoc;
        let useAOLoc;
        let useLightingLoc;
        let aoImageLoc;
        let matSpecLoc;
        let matAmbiLoc;
        let matEmitLoc;
        let matShLoc;
        let srcDiffLoc;
        let srcSpecLoc;
        let srcAmbiLoc;
        let lightDirLoc;
        let fogColorLoc;

        let doorAOTexture = null;

        let grassTexture = null;
        let doorSound = null;
        let bgmSound = null;

        let fadeOverlay = null;
        let transitionState = "idle";
        let transitionTime = 0;
        const transitionDuration = 400;
        let lastRenderTime = performance.now();

        let clouds = [];

        let floorBuffer = null;
        let floorVertexCount = 6;

        let cubeBuffer = null;

        generateModel();

        (async () => {
            await init();
            render();
        })();

        function createDoors(count) {
            doors = [];
            const progress = stage / (stages.length - 1);
            const spawnRange = 12 + progress * 68;
            const minDistance = 3 + progress * 5;
            for (let i = 0; i < count; i++) {
                let x, z, valid = false;
                while (!valid) {
                    x = eye[0] + (Math.random() * 2 - 1) * spawnRange;
                    z = eye[2] + (Math.random() * 2 - 1) * spawnRange;
                    valid = true;
                    let playerDist = Math.sqrt((x - eye[0]) * (x - eye[0]) + (z - eye[2]) * (z - eye[2]));
                    if (playerDist < minDistance) valid = false;
                    for (let door of doors) {
                        let dist = Math.sqrt((x - door.x) * (x - door.x) + (z - door.z) * (z - door.z));
                        if (dist < 4) { valid = false; break; }
                    }
                }
                doors.push({ x: x, z: z, color: [Math.random(), Math.random(), Math.random()] });
            }
            levelText.innerHTML = "선택 단계 : " + (stage + 1);
        }

        function createClouds() {

            clouds = [];

            for (let i = 0; i < 120; i++) {
                clouds.push({
                    x: Math.random() * 1800 - 900,
                    y: 60 + Math.random() * 40,
                    z: Math.random() * 1200 - 600,

                    speed: 0.02 + Math.random() * 0.05,
                    scale: 0.9 + Math.random() * 1.4
                });
            }
        }

        function updatePlayer() {
            let speed = 0.1;
            let forward = vec3(Math.sin(radians(yaw)), 0, -Math.cos(radians(yaw)));
            let right = vec3(Math.cos(radians(yaw)), 0, Math.sin(radians(yaw)));
            if (keys["w"] || keys["W"] || keys["ㅈ"]) eye = add(eye, scale(speed, forward));
            if (keys["s"] || keys["S"] || keys["ㄴ"]) eye = subtract(eye, scale(speed, forward));
            if (keys["a"] || keys["A"] || keys["ㅁ"]) eye = subtract(eye, scale(speed, right));
            if (keys["d"] || keys["D"] || keys["ㅇ"]) eye = add(eye, scale(speed, right));
        }

        function updateSelection() {
            selectedDoor = null;
            let bestDist = 99999;
            for (let door of doors) {
                let dx = eye[0] - door.x;
                let dz = eye[2] - door.z;
                let dist = Math.sqrt(dx * dx + dz * dz);
                if (dist < 4 && dist < bestDist) {
                    bestDist = dist;
                    selectedDoor = door;
                }
            }
            message.innerHTML = selectedDoor ? "E 키를 눌러 선택" : "";
        }

        window.addEventListener("keydown", function (e) {
            keys[e.key.toLowerCase()] = true;
            if ((e.key.toLowerCase() === "e" || e.key === "ㄷ") && selectedDoor) startStageTransition();
        });

        function nextStage() {
            let elapsed = (performance.now() - stageStartTime) / 1000;
            stageTimes.push(elapsed);
            stage++;
            if (stage >= stages.length) {
                showEnding();
                return;
            }
            fogStart -= 0.5;
            fogEnd -= 1;
            stageStartTime = performance.now();
            createDoors(stages[stage]);
        }

        function startStageTransition() {
            if (transitionState !== "idle") return;
            transitionState = "fade-out";
            transitionTime = 0;
            if (fadeOverlay) fadeOverlay.style.opacity = 0;
            if (doorSound) {
                doorSound.pause();
                doorSound.currentTime = 0;
                doorSound.play().catch(() => {});
            }
        }

        function updateTransition(delta) {
            if (transitionState === "idle") return;
            transitionTime += delta;
            if (transitionState === "fade-out") {
                let t = Math.min(transitionTime / transitionDuration, 1);
                fadeOverlay.style.opacity = t;
                if (t >= 1) {
                    nextStage();
                    transitionState = "fade-in";
                    transitionTime = 0;
                }
            } else if (transitionState === "fade-in") {
                let t = Math.min(transitionTime / transitionDuration, 1);
                fadeOverlay.style.opacity = 1 - t;
                if (t >= 1) transitionState = "idle";
            }
        }

        function showEnding() {

            let total = 0;

            for (let t of stageTimes)
                total += t;

            let avg =
                total /
                stageTimes.length;

            let leftColumn = "";
            let rightColumn = "";

            for (let i = 0; i < stageTimes.length; i++) {
                const entry =
                    `
            <div style="margin-bottom: 12px; line-height: 1.4; text-align: left;">
                Stage ${i + 1} (${stages[i]}개의 문) - ${stageTimes[i].toFixed(2)}초
            </div>
            `;

                if (i < 10) {
                    leftColumn += entry;
                } else {
                    rightColumn += entry;
                }
            }

            let stageResult =
                `
            <div style="display:flex; gap:40px; justify-content:center; flex-wrap:wrap; max-width:900px;">
                <div style="flex:1; min-width:240px; text-align:left;">
                    ${leftColumn}
                </div>
                <div style="flex:1; min-width:240px; text-align:left;">
                    ${rightColumn}
                </div>
            </div>
            `;

            document.body.innerHTML =
                `
        <div style="
            width:100vw;
            height:100vh;
            background:black;
            color:white;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            font-family:Arial;
            text-align:center;
            overflow:auto;
        ">

            <h1>선택의 역설</h1>

            <h2>
                평균 고민 시간 :
                ${avg.toFixed(2)}초
            </h2>

            <br>

            <h3>스테이지별 고민 시간</h3>

            ${stageResult}

            <br>

            <p style="font-size:24px">
                선택지는 늘어났지만<br>
                결정은 더 어려워졌습니다.
            </p>

            <button id="restartBtn" style="
                margin-top: 30px;
                padding: 15px 30px;
                font-size: 20px;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                background: #4caf50;
                color: white;
            " onclick="location.reload()">
                다시 하기
            </button>

        </div>
        `;
        }

        function generateModel() {
            const p =
                [
                    vec3(-0.5, -0.5, -0.5),
                    vec3(0.5, -0.5, -0.5),
                    vec3(0.5, 0.5, -0.5),
                    vec3(-0.5, 0.5, -0.5),

                    vec3(-0.5, -0.5, 0.5),
                    vec3(0.5, -0.5, 0.5),
                    vec3(0.5, 0.5, 0.5),
                    vec3(-0.5, 0.5, 0.5)
                ];

            quad(1, 0, 3, 2);
            quad(2, 3, 7, 6);
            quad(3, 0, 4, 7);
            quad(6, 5, 1, 2);
            quad(4, 5, 6, 7);
            quad(5, 4, 0, 1);

            function quad(a, b, c, d) {
                let n = vec3(0, 1, 0);

                push(a, n);
                push(b, n);
                push(c, n);

                push(a, n);
                push(c, n);
                push(d, n);
            }

            function push(i, n) {
                vertices.push(p[i]);
                vertices.push(n);
                vertices.push(vec2(0, 0));

                CubeVertexCount++;
            }
        }

        function generateFloor() {
            const floorData = [
                -500, 0, -500, 0, 1, 0, 0, 0,
                500, 0, -500, 0, 1, 0, 250, 0,
                500, 0, 500, 0, 1, 0, 250, 250,
                -500, 0, -500, 0, 1, 0, 0, 0,
                500, 0, 500, 0, 1, 0, 250, 250,
                -500, 0, 500, 0, 1, 0, 0, 250
            ];
            floorBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, floorBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(floorData), gl.STATIC_DRAW);
        }

        async function init() {
            const canvas = document.getElementById("glCanvas");
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gl = canvas.getContext("webgl2");

            gl.viewport(0, 0, canvas.width, canvas.height);

            gl.enable(gl.DEPTH_TEST);

            const program = initShaders(gl, "shaders/fog_light_vert.glsl", "shaders/fog_light_frag.glsl");
            gl.useProgram(program);
            cubeBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, cubeBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, flatten(vertices), gl.STATIC_DRAW);

            gl.enableVertexAttribArray(0);
            gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 32, 0);
            gl.enableVertexAttribArray(1);
            gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 32, 12);
            gl.enableVertexAttribArray(2);
            gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 32, 24);

            worldMatLoc = gl.getUniformLocation(program, "worldMat");
            viewMatLoc = gl.getUniformLocation(program, "viewMat");
            projMatLoc = gl.getUniformLocation(program, "projMat");
            objectColorLoc = gl.getUniformLocation(program, "objectColor");
            eyePosLoc = gl.getUniformLocation(program, "eyePos");
            fogStartLoc = gl.getUniformLocation(program, "fogStart");
            fogEndLoc = gl.getUniformLocation(program, "fogEnd");
            fogColorLoc = gl.getUniformLocation(program, "fogColor");
            texImageLoc = gl.getUniformLocation(program, "texImage");
            useTextureLoc = gl.getUniformLocation(program, "useTexture");
            aoImageLoc = gl.getUniformLocation(program, "aoImage");
            useAOLoc = gl.getUniformLocation(program, "useAO");
            useLightingLoc = gl.getUniformLocation(program, "useLighting");
            matSpecLoc = gl.getUniformLocation(program, "matSpec");
            matAmbiLoc = gl.getUniformLocation(program, "matAmbi");
            matEmitLoc = gl.getUniformLocation(program, "matEmit");
            matShLoc = gl.getUniformLocation(program, "matSh");
            srcDiffLoc = gl.getUniformLocation(program, "srcDiff");
            srcSpecLoc = gl.getUniformLocation(program, "srcSpec");
            srcAmbiLoc = gl.getUniformLocation(program, "srcAmbi");
            lightDirLoc = gl.getUniformLocation(program, "lightDir");

            grassTexture = loadTexture("obj/grass.png");
            gl.uniform1i(texImageLoc, 0);
            gl.uniform1i(aoImageLoc, 1);
            gl.uniform1i(useTextureLoc, true);
            gl.uniform1i(useAOLoc, false);
            gl.uniform1i(useLightingLoc, true);
            gl.uniform3f(srcDiffLoc, 1.0, 1.0, 1.0);
            gl.uniform3f(srcSpecLoc, 1.0, 1.0, 1.0);
            gl.uniform3f(srcAmbiLoc, 0.3, 0.3, 0.3);
            gl.uniform3f(matSpecLoc, 0.4, 0.4, 0.4);
            gl.uniform3f(matAmbiLoc, 0.35, 0.35, 0.35);
            gl.uniform3f(matEmitLoc, 0.0, 0.0, 0.0);
            gl.uniform1f(matShLoc, 20.0);
            gl.uniform3f(lightDirLoc, 0.5, 0.7, 0.2);
            gl.uniform1f(fogColorLoc, 0.92);

            let proj = perspective(70, canvas.width / canvas.height, 0.1, 1000);
            gl.uniformMatrix4fv(projMatLoc, false, flatten(proj));
            createDoors(stages[0]);
            await loadOBJ("obj/Wooden-Door.obj");
            doorTexture = loadTexture("obj/Diffuse.png");
            doorAOTexture = loadTexture("obj/Diffuse_AO.png");
            doorSound = new Audio("sound/Door.mp3");
            doorSound.preload = "auto";
            doorSound.volume = 0.5;
            doorSound.load();
            bgmSound = new Audio("sound/Bgm.mp3");
            bgmSound.loop = true;
            bgmSound.preload = "auto";
            bgmSound.volume = 1.0;
            bgmSound.load();
            bgmSound.play().catch(() => {});

            canvas.onclick = () => canvas.requestPointerLock();

            document.addEventListener("mousemove", function (e) {
                if (document.pointerLockElement !== canvas) return;
                yaw += e.movementX * 0.15;
                pitch -= e.movementY * 0.15;
                pitch = Math.max(-89, Math.min(89, pitch));
            });

            window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);
            document.getElementById("startBtn").onclick = function () {
                gameStarted = true;
                document.getElementById("startScreen").style.display = "none";
                document.getElementById("glCanvas").requestPointerLock();
                if (bgmSound) {
                    bgmSound.currentTime = 0;
                    bgmSound.play().catch(() => {});
                }
                stageStartTime = performance.now();
            };
            fadeOverlay = document.getElementById("fadeOverlay");
            generateFloor();
            createClouds();
        }

        async function loadOBJ(url) {
            const text =
                await fetch(url)
                    .then(r => r.text());

            const positions = [];
            const texcoords = [];

            const finalData = [];

            const lines =
                text.split("\n");

            for (let line of lines) {
                line = line.trim();

                if (line.startsWith("v ")) {
                    const p =
                        line.split(/\s+/);

                    positions.push([
                        parseFloat(p[1]),
                        parseFloat(p[2]),
                        parseFloat(p[3])
                    ]);
                }

                else if (line.startsWith("vt ")) {
                    const p =
                        line.split(/\s+/);

                    texcoords.push([
                        parseFloat(p[1]),
                        1.0 - parseFloat(p[2])
                    ]);
                }

                else if (line.startsWith("f ")) {
                    const verts =
                        line.split(/\s+/)
                            .slice(1);

                    let face = [];

                    for (let v of verts) {
                        const parts =
                            v.split("/");

                        face.push({
                            pos:
                                parseInt(parts[0]) - 1,

                            tex:
                                parseInt(parts[1]) - 1
                        });
                    }

                    for (let i = 1; i < face.length - 1; i++) {
                        const tri = [
                            face[0],
                            face[i],
                            face[i + 1]
                        ];

                        const p0 = positions[tri[0].pos];
                        const p1 = positions[tri[1].pos];
                        const p2 = positions[tri[2].pos];
                        const normal = normalize(cross(
                            subtract(vec3(p1[0], p1[1], p1[2]), vec3(p0[0], p0[1], p0[2])),
                            subtract(vec3(p2[0], p2[1], p2[2]), vec3(p0[0], p0[1], p0[2]))
                        ));

                        for (let vert of tri) {
                            finalData.push(
                                positions[vert.pos][0],
                                positions[vert.pos][1],
                                positions[vert.pos][2],

                                normal[0],
                                normal[1],
                                normal[2],

                                texcoords[vert.tex][0],
                                texcoords[vert.tex][1]
                            );
                        }
                    }
                }
            }

            doorOBJVertexCount = finalData.length / 8;
            doorOBJBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, doorOBJBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(finalData), gl.STATIC_DRAW);
            console.log("OBJ Loaded:", doorOBJVertexCount, "vertices");
        }

        function isPowerOf2(value) {
            return (value & (value - 1)) === 0;
        }

        function loadTexture(url) {
            const texture = gl.createTexture();
            const image = new Image();
            image.onload = function () {
                gl.bindTexture(gl.TEXTURE_2D, texture);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
                if (url.includes("grass")) {
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
                } else {
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                    if (isPowerOf2(image.width) && isPowerOf2(image.height)) {
                        gl.generateMipmap(gl.TEXTURE_2D);
                        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
                    } else {
                        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                    }
                }
            };
            image.src = url;
            return texture;
        }

        function render() {
            let now = performance.now();
            let delta = now - lastRenderTime;
            lastRenderTime = now;
            if (!gameStarted) {
                requestAnimationFrame(render);
                return;
            }
            if (transitionState !== "idle") updateTransition(delta);
            if (transitionState === "idle") {
                updatePlayer();
                updateSelection();
            }
            gl.clearColor(0.53, 0.81, 0.92, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

            for (let cloud of clouds) {
                cloud.x += cloud.speed;

                if (cloud.x > 1100) {
                    cloud.x = -1100;
                    cloud.y = 60 + Math.random() * 40;
                    cloud.z = Math.random() * 1200 - 600;
                    cloud.scale = 0.9 + Math.random() * 1.4;
                }
            }

            let forward = vec3(Math.sin(radians(yaw)) * Math.cos(radians(pitch)), Math.sin(radians(pitch)), -Math.cos(radians(yaw)) * Math.cos(radians(pitch)));
            let view = lookAt(eye, add(eye, forward), vec3(0, 1, 0));
            gl.uniformMatrix4fv(viewMatLoc, false, flatten(view));
            gl.uniform3fv(eyePosLoc, flatten(eye));
            gl.uniform1f(fogStartLoc, fogStart);
            gl.uniform1f(fogEndLoc, fogEnd);

            gl.uniform1i(useTextureLoc, false);
            gl.uniform1i(useTextureLoc, true);
            gl.uniform1i(useAOLoc, false);
            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, grassTexture);
            gl.uniform1i(texImageLoc, 0);

            gl.uniform1i(useTextureLoc, true);
            gl.uniform1i(useAOLoc, false);
            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, grassTexture);
            gl.uniform1i(texImageLoc, 0);
            gl.bindBuffer(gl.ARRAY_BUFFER, floorBuffer);
            gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 32, 0);
            gl.enableVertexAttribArray(0);
            gl.enableVertexAttribArray(1);
            gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 32, 12);
            gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 32, 24);
            gl.enableVertexAttribArray(2);
            gl.uniformMatrix4fv(worldMatLoc, false, flatten(mat4()));
            gl.drawArrays(gl.TRIANGLES, 0, floorVertexCount);

            gl.uniform1i(useTextureLoc, true);
            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, doorTexture);
            gl.uniform1i(texImageLoc, 0);
            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, doorTexture);
            gl.uniform1i(texImageLoc, 0);
            gl.activeTexture(gl.TEXTURE1);
            gl.bindTexture(gl.TEXTURE_2D, doorAOTexture);
            gl.uniform1i(aoImageLoc, 1);
            gl.uniform1i(useAOLoc, true);
            gl.uniform1i(useTextureLoc, false);
            gl.uniform1i(useAOLoc, false);
            gl.bindBuffer(gl.ARRAY_BUFFER, cubeBuffer);
            gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 32, 0);
            gl.enableVertexAttribArray(0);
            gl.enableVertexAttribArray(1);
            gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 32, 12);
            gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 32, 24);
            gl.enableVertexAttribArray(2);

            for (let cloud of clouds) {
                const parts = [[-4, 0, 0, 9, 3, 6], [0, 0, 0, 12, 4, 7], [6, 0, 1, 8, 3, 6], [1, 1, 0, 7, 3, 5]];
                for (let p of parts) {
                    let cloudWorld = mult(translate(cloud.x + p[0], cloud.y + p[1], cloud.z + p[2]), scalem(p[3] * cloud.scale, p[4] * cloud.scale, p[5] * cloud.scale));
                    gl.uniformMatrix4fv(worldMatLoc, false, flatten(cloudWorld));
                    gl.uniform3f(objectColorLoc, 1.0, 1.0, 1.0);
                    gl.drawArrays(gl.TRIANGLES, 0, CubeVertexCount);
                }
            }

            gl.uniform1i(useTextureLoc, true);
            gl.uniform1i(useAOLoc, false);
            gl.uniform1i(useLightingLoc, false);
            for (let door of doors) {
                let world = mult(translate(door.x, 1.6, door.z), scalem(0.8, 0.8, 0.8));
                gl.uniformMatrix4fv(worldMatLoc, false, flatten(world));
                gl.uniform3f(objectColorLoc, 1.0, 1.0, 1.0);
                gl.bindBuffer(gl.ARRAY_BUFFER, doorOBJBuffer);
                gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 32, 0);
                gl.enableVertexAttribArray(0);
                gl.enableVertexAttribArray(1);
                gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 32, 12);
                gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 32, 24);
                gl.enableVertexAttribArray(2);
                gl.drawArrays(gl.TRIANGLES, 0, doorOBJVertexCount);
            }

            requestAnimationFrame(render);
        }

    </script>
